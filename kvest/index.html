<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Дело о похищенном сердце</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,600;0,700;1,600&family=PT+Mono&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Marck+Script&display=swap">
<style>
/* Layout: one case-file folder lying on a dark desk under a lamp; one clue per screen. Single deliberate dark look. */
:root {
  --desk: #1b1214;
  --lamp: rgba(255, 190, 120, .16);
  --paper: #efe4cb;
  --paper-2: #e4d5b2;
  --ink: #2b1e19;
  --muted: #74604d;
  --seal: #a3172f;
  --pen: #2f4a7d;
  --f-display: "Cormorant", "Times New Roman", serif;
  --f-body: "PT Serif", Georgia, serif;
  --f-type: "PT Mono", "Courier New", monospace;
  --f-hand: "Marck Script", "Segoe Script", cursive;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--desk); }
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse 90% 60% at 50% 0%, var(--lamp), transparent 70%),
    var(--desk);
  color: var(--ink);
  font: 17px/1.55 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.folder { max-width: 560px; margin: 0 auto; position: relative; }
.tab {
  display: inline-block;
  background: var(--paper-2);
  font: 12px/1 var(--f-type);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 10px 16px 8px;
  border-radius: 6px 6px 0 0;
  margin-left: 18px;
}
.sheet {
  background: var(--paper);
  border-radius: 4px;
  padding: 28px 24px 30px;
  box-shadow: 0 1px 0 var(--paper-2) inset, 0 18px 40px rgba(0,0,0,.45);
  position: relative;
  overflow: clip;
  display: grid;
  gap: 18px;
}
.sheet::after { /* faint coffee ring */
  content: "";
  position: absolute;
  width: 150px; height: 150px;
  right: -40px; bottom: -50px;
  border-radius: 50%;
  border: 9px solid rgba(120, 80, 40, .07);
  pointer-events: none;
}
.meta {
  display: flex; flex-wrap: wrap; gap: 6px 14px;
  justify-content: space-between; align-items: center;
  font: 12px/1.3 var(--f-type);
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 1px dashed rgba(43,30,25,.25);
  padding-bottom: 12px;
}
.dots { display: flex; gap: 5px; }
.dots i { width: 10px; height: 10px; border: 1.5px solid var(--muted); border-radius: 2px; display: block; }
.dots i.on { background: var(--seal); border-color: var(--seal); }
.stamp {
  position: absolute; top: 58px; right: 14px;
  font: 700 13px/1 var(--f-type);
  letter-spacing: .2em;
  color: var(--seal);
  border: 2px solid var(--seal);
  padding: 6px 8px;
  transform: rotate(8deg);
  opacity: .55;
  pointer-events: none;
}
h1 {
  font: 700 clamp(34px, 9vw, 46px)/1.02 var(--f-display);
  margin: 0;
  text-wrap: balance;
  padding-right: 70px;
}
.greet { font: 26px/1.2 var(--f-hand); color: var(--pen); margin: 0; }
.story p { margin: 0 0 .7em; }
.story p:last-child { margin: 0; }
.intro {
  font: 14px/1.6 var(--f-type);
  background: rgba(255,255,255,.35);
  border: 1px solid rgba(43,30,25,.15);
  padding: 14px 16px;
}
.q { font: 700 19px/1.3 var(--f-body); margin: 4px 0 0; }
.opts { display: grid; gap: 10px; }
.opt {
  display: flex; gap: 12px; align-items: baseline;
  width: 100%;
  text-align: left;
  font: 16px/1.35 var(--f-body);
  color: var(--ink);
  background: rgba(255,255,255,.45);
  border: 1.5px solid rgba(43,30,25,.3);
  border-radius: 3px;
  padding: 13px 14px;
  cursor: pointer;
  transition: background .15s, border-color .15s, transform .1s;
}
.opt:hover { background: rgba(255,255,255,.7); border-color: var(--ink); }
.opt:active { transform: translateY(1px); }
.opt:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; }
.opt b { font: 13px/1 var(--f-type); color: var(--muted); }
.opt.wrong { text-decoration: line-through; text-decoration-color: var(--seal); color: var(--muted); background: transparent; cursor: default; }
.opt.right { border-color: var(--seal); background: rgba(163,23,47,.08); font-weight: 700; }
.note {
  font: 23px/1.3 var(--f-hand);
  color: var(--pen);
  background: #f6ecb6;
  padding: 14px 16px 16px;
  transform: rotate(-1deg);
  box-shadow: 0 6px 14px rgba(0,0,0,.18);
  margin: 0;
}
.found { display: grid; gap: 10px; border-top: 1px dashed rgba(43,30,25,.25); padding-top: 18px; position: relative; }
.found .lbl { font: 12px/1 var(--f-type); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.found .place { font: 700 clamp(30px, 8vw, 40px)/1.05 var(--f-display); color: var(--seal); margin: 0; }
.found p { margin: 0; }
.verdict {
  position: absolute; right: 0; top: -4px;
  font: 700 16px/1 var(--f-type); letter-spacing: .18em;
  color: var(--seal); border: 3px double var(--seal);
  padding: 8px 10px; transform: rotate(-9deg);
  animation: slam .45s cubic-bezier(.2,1.6,.4,1) both;
}
@keyframes slam { from { transform: rotate(-9deg) scale(2.4); opacity: 0; } to { transform: rotate(-9deg) scale(1); opacity: .9; } }
.letter { font: 25px/1.4 var(--f-hand); color: var(--pen); }
.letter p { margin: 0 0 .5em; }
.sign { text-align: right; }
.small { font: 13px/1.5 var(--f-type); color: var(--muted); }
.list { display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; }
.list li { display: grid; gap: 2px; border-bottom: 1px dashed rgba(43,30,25,.2); padding-bottom: 10px; }
.list a { color: var(--seal); font: 14px/1.4 var(--f-type); word-break: break-all; }
@media (prefers-reduced-motion: reduce) { .verdict { animation: none; } .opt { transition: none; } }
</style>
</head>
<body>
<main class="folder" id="app" aria-live="polite"></main>
<script>
/* ==== ВСЁ, ЧТО МОЖНО МЕНЯТЬ — ЗДЕСЬ ==== */
const CASE = "Дело № 1 · О похищенном сердце";
const AUTHOR_KEY = "avtor-8a8f";   // страница-шпаргалка со всеми этапами: ...#avtor-8a8f

const STAGES = [
  {
    key: "ulika-aea3",
    title: "Холодный след",
    greet: "Писюлкина Викуля,",
    intro: "Любимая, у нас ЧП. Однажды кто-то украл моё сердце, и дело до сих пор не закрыто. Сегодня его поручают лучшему детективу — тебе. Улики спрятаны по всему дому. Рядом с каждой лежит маленький подарок и новый QR-код. Отвечай на вопросы свидетелей, они подскажут, где искать дальше.",
    story: ["Первый свидетель заметил подозреваемого у места, где всегда холодно, зато живёт всё самое вкусное. Стоит открыть дверцу, и внутри загорается свет."],
    question: "Куда отправится детектив?",
    options: [
      { text: "На балкон", hint: "Холодно, согласен, логика железная. Но свет там сам не включается, и вкусненького нет. Куда ты заглядываешь «просто посмотреть»?" },
      { text: "К холодильнику", right: true },
      { text: "К шкафчику с посудой", hint: "Тарелки там есть, а еды нет. Вспомни, где хранится то, что на тарелки потом кладут, и где от этого прохладно." },
      { text: "К духовке", hint: "Горячо! В смысле, совсем наоборот: нам нужно место, где холодно. Ты почти у цели, Викуля." }
    ],
    place: "Холодильник",
    after: "Загляни внутрь — улика №2 ждёт тебя на полке."
  },
  {
    key: "ulika-bd51",
    title: "Отражение",
    greet: "Любимая,",
    story: ["Отпечатков на холодильнике нет, зато есть зацепка. Подозреваемый признался, что каждое утро там можно увидеть самую красивую девушку на свете. Она смотрит прямо на тебя и улыбается, когда улыбаешься ты."],
    question: "Где искать следующую улику?",
    options: [
      { text: "У окна", hint: "За окном много красивого, но самое красивое — по эту сторону стекла. Где ты видишь саму себя?" },
      { text: "В телефоне, на селфи-камере", hint: "Почти! Только без фильтров и без камеры. Где ты встречаешь себя каждое утро, сонная и всё равно прекрасная?" },
      { text: "У зеркала в ванной", right: true },
      { text: "В фотоальбоме", hint: "Там тоже есть красавица, но на фото она не улыбается в ответ. Нужна та, что повторяет за тобой." }
    ],
    place: "Зеркало в ванной",
    after: "Поищи рядом с зеркалом. И улыбнись ему, это часть следствия."
  },
  {
    key: "ulika-6487",
    title: "Безмолвные свидетели",
    greet: "Викуля,",
    story: ["В ванной нашлась новая зацепка. Следующая улика спрятана среди тех, кто каждый день тебя обнимает и ни разу не проронил ни слова. Их у тебя целая толпа, но по утрам ты всё равно говоришь, что надеть нечего."],
    question: "Кто эти молчаливые свидетели?",
    options: [
      { text: "Кровать", hint: "Тепло-тепло! Кровать и правда обнимает, но её очередь ещё придёт. Подумай о тех, кого ты перебираешь со словами «нечего надеть»." },
      { text: "Обувь в прихожей", hint: "Обувь не обнимает, она тебя носит. Ну, или ты её. Ищи тех, кто обнимает за плечи." },
      { text: "Диван", hint: "Диван обнимает только по выходным. Нужны те, кто с тобой каждый день и висит на вешалке." },
      { text: "Одежда в шкафу", right: true }
    ],
    place: "Шкаф с одеждой",
    after: "Пошарь между вешалками."
  },
  {
    key: "ulika-94ff",
    title: "Архив историй",
    greet: "Детектив Викуля,",
    story: ["Ты идёшь по верному следу. Следующая улика хранится там, где живёт много историй. Ни одна из них не сравнится с нашей: у каждой есть последняя страница, а у нашей её нет."],
    question: "Где живут эти истории?",
    options: [
      { text: "На книжной полке", right: true },
      { text: "В телевизоре", hint: "Сериалы тоже истории, но их не листают пальцами. Где у историй есть обложки и страницы?" },
      { text: "В ноутбуке", hint: "В интернете историй миллион, но улику туда не спрячешь. Нужно место, где истории стоят рядышком, корешок к корешку." },
      { text: "В ящике с документами", hint: "Там лежат скучные истории с печатями. Наша совсем не такая. Где живут истории с хорошим концом?" }
    ],
    place: "Книжная полка",
    after: "Проверь между книгами. Ищи ту, что стоит не на своём месте."
  },
  {
    key: "ulika-e456",
    title: "Место преступления",
    greet: "Моя любимая,",
    story: ["Дело почти раскрыто. Последний свидетель видел подозреваемого там, где ты видишь сны, а он каждую ночь видит тебя. Ищи под тем, на что ты кладёшь свою прекрасную голову."],
    question: "Где спрятана улика?",
    options: [
      { text: "Под кроватью", hint: "Там живут только потерянные носки и пыльные монстры, улике там страшно. Поднимись чуть выше." },
      { text: "Под одеялом", hint: "Ооочень близко! Но голову ты кладёшь не на одеяло. Чуть-чуть выше, Викуля." },
      { text: "Под подушкой", right: true },
      { text: "Под ковром", hint: "Под ковёр заметают улики только плохие детективы, а ты лучшая. Ищи там, где спит твоя голова." }
    ],
    place: "Под подушкой",
    after: "Под твоей подушкой, не под моей 😉"
  },
  {
    key: "ulika-0de0",
    title: "Признание",
    greet: "Писюлкина Викуля,",
    story: ["Ты собрала все улики. Осталось последнее: назвать того, кто украл твоё сердце."],
    question: "Кто похититель?",
    options: [
      { text: "Кот из соседнего подъезда", hint: "У кота алиби: он весь день спал. Похититель гораздо ближе и гораздо влюблённее." },
      { text: "Курьер с цветами", hint: "Курьер только принёс цветы. А кто их заказал? Вот и думай, детектив." },
      { text: "Шоколадка в холодильнике", hint: "Шоколадка украла у тебя пару минут, не больше. А сердце похитил кто-то посерьёзнее." },
      { text: "Тот, кто любит тебя больше всех на свете", right: true }
    ],
    final: [
      "Обернись.",
      "Похититель стоит прямо за тобой и сдаётся без сопротивления.",
      "Дело закрыто. Приговор: пожизненно вместе, без права на побег.",
      "С годовщиной, моя любимая."
    ],
    sign: "Твой подозреваемый №1"
  }
];
/* ==== дальше логика ==== */

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const LETTERS = "АБВГДЕ";

function shell(tab, inner, stamp = "Секретно") {
  return `<div class="tab">${esc(tab)}</div><article class="sheet">${stamp ? `<div class="stamp">${esc(stamp)}</div>` : ""}${inner}</article>`;
}

function renderLocked() {
  app.innerHTML = shell(CASE, `
    <div class="meta"><span>Доступ ограничен</span></div>
    <h1>Материалы засекречены</h1>
    <p class="story">Эту папку открывают только по QR-коду, найденному на месте улики. Ищи код, детектив.</p>`);
  document.title = "Дело о похищенном сердце";
}

function renderAuthor() {
  const base = location.href.split("#")[0];
  app.innerHTML = shell("Шпаргалка автора", `
    <div class="meta"><span>Только для тебя, не показывай Вике</span></div>
    <h1>Маршрут квеста</h1>
    <ul class="list">${STAGES.map((s, i) => `
      <li><span class="small">QR №${i + 1} · лежит: ${i === 0 ? "вручаешь сам" : esc(STAGES[i - 1].place)}</span>
      <strong>${esc(s.title)}</strong>
      <span class="small">Ответ ведёт: ${s.place ? esc(s.place) : "финал, ты рядом"}</span>
      <a href="#${s.key}">${esc(base)}#${s.key}</a></li>`).join("")}
    </ul>`, "");
}

function renderStage(idx) {
  const s = STAGES[idx];
  const n = STAGES.length;
  const dots = STAGES.map((_, i) => `<i class="${i <= idx ? "on" : ""}"></i>`).join("");
  app.innerHTML = shell(CASE, `
    <div class="meta"><span>Улика № ${idx + 1} из ${n}</span><span class="dots" aria-hidden="true">${dots}</span></div>
    <h1>${esc(s.title)}</h1>
    <p class="greet">${esc(s.greet)}</p>
    ${s.intro ? `<p class="intro">${esc(s.intro)}</p>` : ""}
    <div class="story">${s.story.map(p => `<p>${esc(p)}</p>`).join("")}</div>
    <p class="q">${esc(s.question)}</p>
    <div class="opts" id="opts">${s.options.map((o, i) =>
      `<button class="opt" type="button" id="opt-${i}" data-i="${i}"><b>${LETTERS[i]}</b><span>${esc(o.text)}</span></button>`).join("")}
    </div>
    <div id="out"></div>`);
  document.title = `Улика № ${idx + 1} · ${s.title}`;
  window.scrollTo(0, 0);

  const out = document.getElementById("out");
  document.getElementById("opts").addEventListener("click", e => {
    const btn = e.target.closest(".opt");
    if (!btn || btn.disabled) return;
    const o = s.options[+btn.dataset.i];
    if (o.right) {
      document.querySelectorAll(".opt").forEach(b => b.disabled = true);
      btn.classList.add("right");
      out.innerHTML = s.final ? finalHtml(s) : `
        <section class="found">
          <div class="verdict">Верно</div>
          <span class="lbl">Следующая улика</span>
          <p class="place">${esc(s.place)}</p>
          <p>${esc(s.after)}</p>
        </section>`;
    } else {
      btn.classList.add("wrong");
      btn.disabled = true;
      out.innerHTML = `<p class="note">${esc(o.hint)}</p>`;
    }
    out.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" });
  });
}

function finalHtml(s) {
  return `<section class="found">
    <div class="verdict">Раскрыто</div>
    <span class="lbl">Заключение следствия</span>
    <div class="letter">${s.final.map(p => `<p>${esc(p)}</p>`).join("")}<p class="sign">${esc(s.sign)}</p></div>
  </section>`;
}

function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === AUTHOR_KEY) return renderAuthor();
  const idx = STAGES.findIndex(s => s.key === h);
  idx >= 0 ? renderStage(idx) : renderLocked();
}
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
